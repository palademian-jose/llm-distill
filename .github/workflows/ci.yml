name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  LLM_PROVIDER: fake
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

# `llm-evalops` is a path dependency (`../llm-evalops`, see [tool.uv.sources] in pyproject.toml).
# actions/checkout cannot write outside $GITHUB_WORKSPACE, so both repos are checked out side by
# side inside it (llm-distill/ and llm-evalops/) and every step runs from llm-distill/. The
# sibling repo must be public; if it is private, add a read-only token as EVALOPS_TOKEN.
defaults:
  run:
    working-directory: llm-distill

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: llm-distill
      - uses: actions/checkout@v4
        with:
          repository: palademian-jose/llm-evalops
          path: llm-evalops
          token: ${{ secrets.EVALOPS_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: llm-distill/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Test
        run: uv run pytest -q

  distill:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
        with:
          path: llm-distill
      - uses: actions/checkout@v4
        with:
          repository: palademian-jose/llm-evalops
          path: llm-evalops
          token: ${{ secrets.EVALOPS_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: llm-distill/uv.lock
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ms-marco-minilm-l6
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Build pairs and label with the fake teacher
        run: |
          uv run python scripts/build_dataset.py
          uv run python scripts/label_teacher.py
      - name: Train S2 and S1, export ONNX
        run: |
          uv run python scripts/train_baseline.py
          uv run python scripts/train.py
          uv run python scripts/export_onnx.py
      - name: Compare
        run: uv run python scripts/compare.py
      - name: Regression gate
        run: |
          uv run evalkit gate \
            --baseline reports/baseline.json \
            --candidate reports/eval-latest.json \
            --config evals.yaml \
            --md reports/gate.md \
            --annotate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            llm-distill/reports/
            !llm-distill/reports/eval-distill-*.json
